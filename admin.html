<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Centa Limited</title>
<style>
  :root{--accent:#15E0ED;--bg:#000;--panel:#0b0d0d;--border:#1a1d1d;--text:#eef2f2;--text-dim:#8a9494;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:32px 20px;line-height:1.5;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:6px;}
  h2{font-size:13px;margin-bottom:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;}
  .muted{color:var(--text-dim);font-size:13px;margin-bottom:24px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px;}
  label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input,textarea{width:100%;border:1px solid var(--border);background:#0a0c0c;color:var(--text);border-radius:8px;padding:10px 12px;font:inherit;font-size:13px;outline:none;}
  input:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:80px;}
  button{background:var(--accent);color:#00171a;border:none;padding:10px 20px;font-weight:700;border-radius:6px;cursor:pointer;font-size:13px;margin-top:16px;}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .status{margin-top:12px;font-size:13px;min-height:18px;color:var(--text-dim);}
  .status.ok{color:var(--accent);}
  .status.err{color:#ff6b6b;}
  .product-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}
  .product-item img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#111;}
  .product-item .info{flex:1;}
  .product-item .name{font-weight:700;font-size:14px;}
  .product-item .price{font-size:12px;color:var(--accent);}
  .product-item button{background:#3a1414;color:#ff9b9b;padding:6px 12px;font-size:12px;margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin Panel</h1>
  <p class="muted">Upload & kelola produk. Data tersimpan di <code>products.json</code>.</p>

  <div class="card">
    <h2>1. GitHub Config</h2>
    <div class="row">
      <div><label>Username</label><input id="gh-user" placeholder="username"></div>
      <div><label>Repository</label><input id="gh-repo" placeholder="nama-repo"></div>
    </div>
    <label>Personal Access Token</label>
    <input id="gh-token" type="password" placeholder="github_pat_...">
    <button id="save-config" class="ghost">Simpan Config</button>
    <div class="status" id="config-status"></div>
  </div>

  <div class="card">
    <h2>2. Tambah Produk</h2>
    <label>Nama Produk</label>
    <input id="p-name" placeholder="Centa VPN">
    <label>Deskripsi</label>
    <textarea id="p-desc" placeholder="Deskripsi singkat..."></textarea>
    <div class="row">
      <div><label>Harga</label><input id="p-price" placeholder="Rp 99.000 / bulan"></div>
      <div><label>Link (opsional)</label><input id="p-link" placeholder="https://..."></div>
    </div>
    <label>Gambar Produk</label>
    <input id="p-image" type="file" accept="image/*">
    <button id="add-product">Tambah Produk</button>
    <div class="status" id="add-status"></div>
  </div>

  <div class="card">
    <h2>3. Daftar Produk</h2>
    <div id="product-list"><p class="muted">Belum ada produk.</p></div>
  </div>
</div>

<script>
const GH_API = 'https://api.github.com';
const PRODUCTS_FILE = 'products.json';

let config = JSON.parse(localStorage.getItem('centa-admin') || '{}');
let products = [];
let productsSha = null;

document.getElementById('gh-user').value = config.user || '';
document.getElementById('gh-repo').value = config.repo || '';
document.getElementById('gh-token').value = config.token || '';

document.getElementById('save-config').addEventListener('click', () => {
  config = {
    user: document.getElementById('gh-user').value.trim(),
    repo: document.getElementById('gh-repo').value.trim(),
    token: document.getElementById('gh-token').value.trim()
  };
  localStorage.setItem('centa-admin', JSON.stringify(config));
  setStatus('config-status', 'Config tersimpan.', 'ok');
  loadProducts();
});

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status ' + (type || '');
}
function headers() {
  return { 'Authorization': `Bearer ${config.token}`, 'Accept': 'application/vnd.github+json' };
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadProducts() {
  if (!config.user || !config.repo || !config.token) return;
  try {
    const res = await fetch(`${GH_API}/repos/${config.user}/${config.repo}/contents/${PRODUCTS_FILE}`, { headers: headers() });
    if (res.status === 404) { products = []; productsSha = null; }
    else if (!res.ok) throw new Error('Gagal load: ' + res.status);
    else {
      const data = await res.json();
      productsSha = data.sha;
      const raw = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
      products = JSON.parse(raw) || [];
    }
    renderProducts();
  } catch (e) { setStatus('config-status', e.message, 'err'); }
}

function renderProducts() {
  const list = document.getElementById('product-list');
  if (!products.length) { list.innerHTML = '<p class="muted">Belum ada produk.</p>'; return; }
  list.innerHTML = products.map((p, i) => `
    <div class="product-item">
      ${p.image ? `<img src="${p.image}" alt="">` : '<img alt="">'}
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="price">${escapeHtml(p.price || '')}</div>
      </div>
      <button data-i="${i}">Hapus</button>
    </div>`).join('');
  list.querySelectorAll('button[data-i]').forEach(b =>
    b.addEventListener('click', () => deleteProduct(parseInt(b.dataset.i))));
}

async function commitProducts(message) {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
  const body = { message, content };
  if (productsSha) body.sha = productsSha;
  const res = await fetch(`${GH_API}/repos/${config.user}/${config.repo}/contents/${PRODUCTS_FILE}`, {
    method: 'PUT',
    headers: { ...headers(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || 'Commit gagal'); }
  const data = await res.json();
  productsSha = data.content.sha;
}

async function uploadImage(file) {
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const filename = `images/${Date.now()}-${safe}`;
  const buf = await file.arrayBuffer();
  let bin = '';
  new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
  const res = await fetch(`${GH_API}/repos/${config.user}/${config.repo}/contents/${filename}`, {
    method: 'PUT',
    headers: { ...headers(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: `Upload ${filename}`, content: btoa(bin) })
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message || 'Upload gambar gagal'); }
  return filename;
}

document.getElementById('add-product').addEventListener('click', async () => {
  if (!config.token) return setStatus('add-status', 'Isi config GitHub dulu.', 'err');
  const name = document.getElementById('p-name').value.trim();
  const desc = document.getElementById('p-desc').value.trim();
  const price = document.getElementById('p-price').value.trim();
  const link = document.getElementById('p-link').value.trim();
  const file = document.getElementById('p-image').files[0];
  if (!name) return setStatus('add-status', 'Nama produk wajib diisi.', 'err');
  try {
    setStatus('add-status', 'Menyimpan...', '');
    let imagePath = '';
    if (file) imagePath = await uploadImage(file);
    products.push({ name, desc, price, link, image: imagePath, createdAt: new Date().toISOString() });
    await commitProducts(`Add product: ${name}`);
    renderProducts();
    ['p-name','p-desc','p-price','p-link','p-image'].forEach(id => document.getElementById(id).value = '');
    setStatus('add-status', 'Produk berhasil ditambahkan!', 'ok');
  } catch (e) { setStatus('add-status', e.message, 'err'); }
});

async function deleteProduct(i) {
  if (!confirm('Hapus produk ini?')) return;
  const name = products[i].name;
  products.splice(i, 1);
  try { await commitProducts(`Delete product: ${name}`); renderProducts(); }
  catch (e) { alert(e.message); loadProducts(); }
}

loadProducts();
</script>
</body>
</html>
